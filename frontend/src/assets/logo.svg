<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Angular Physics logo">
  <!-- Angle wedge (the "Angular" in Angular Physics) -->
  <path d="M20 20 L20 4 A16 16 0 0 1 33.86 28" fill="none" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <!-- Orbit ellipse (electron path) -->
  <ellipse cx="20" cy="20" rx="15" ry="7" fill="none" stroke="#F59E0B" stroke-width="2.2" transform="rotate(-25 20 20)"/>
  <!-- Nucleus -->
  <circle cx="20" cy="20" r="3.2" fill="#1E1B4B"/>
  <!-- Electron -->
  <circle cx="33" cy="12.5" r="2.4" fill="#F59E0B"/>
</svg>
